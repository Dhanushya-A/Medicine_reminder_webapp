<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>

<h2>Reset Password</h2>

<form method="POST">

    <input
        type="password"
        name="password"
        placeholder="New Password"
        required>

    <button type="submit">
        Update Password
    </button>

</form>

</body>
</html>
