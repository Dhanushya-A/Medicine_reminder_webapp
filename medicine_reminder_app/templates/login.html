<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>

<link rel="stylesheet"
href="{{ url_for('static',
filename='css/style.css') }}">

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
rel="stylesheet">

</head>

<body class="auth-body">

<div class="auth-container">

<div class="auth-card">

<h1>MediCare 💊</h1>

<p>
Login to continue
</p>

{% with messages = get_flashed_messages() %}

    {% if messages %}

        {% for msg in messages %}

            <div class="flash">
                {{ msg }}
            </div>

        {% endfor %}

    {% endif %}

{% endwith %}

<script>

setTimeout(function(){

    let flash = document.querySelector(".flash");

    if(flash){

        flash.style.display = "none";

    }

},3000);

</script>

<form method="POST">

<input
type="email"
name="email"
placeholder="Email"
required>

<input
type="password"
name="password"
placeholder="Password"
required>

<button>
Login
</button>

</form>

<a href="{{ url_for('forgot_password') }}">
    Forgot Password?
</a>

<a href="/register">
Create Account
</a>

</div>

</div>

</body>
</html>
